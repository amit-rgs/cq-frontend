name: Deploy CQ Frontend
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod
      image_tag:
        description: "ECR Image Tag"
        required: true
        default: latest
        type: string

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: frontend-repo
  ECS_CLUSTER: cq-frontend-cluster
  ECS_SERVICE: cq-frontend
  TASK_DEFINITION_FAMILY: cq-frontend
  CONTAINER_NAME: cq-frontend

jobs:
  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      #####################################################
      # Authenticate to AWS
      #####################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      #####################################################
      # Render New Task Definition with Updated Image
      #####################################################
      - name: Download Current Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${TASK_DEFINITION_FAMILY} \
            --query taskDefinition \
            > task-definition.json

      - name: Fill in New Image ID
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.inputs.image_tag }}

      #####################################################
      # Deploy to ECS Service
      #####################################################
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      #####################################################
      # Deployment Summary
      #####################################################
      - name: Deployment Summary
        run: |
          echo "======================================="
          echo " ECS Deployment Successful"
          echo "======================================="
          echo "Environment : ${{ github.event.inputs.environment }}"
          echo "Cluster     : ${ECS_CLUSTER}"
          echo "Service     : ${ECS_SERVICE}"
          echo ""
          echo "Image"
          echo "${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${{ github.event.inputs.image_tag }}"
          echo "======================================="
